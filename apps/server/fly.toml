# Fly.io config for the game server (NOT deployed in Phase 1; see docs/deployment.md "Cloud").
# Deploy from the repository root:
#   fly deploy . -c apps/server/fly.toml --dockerfile apps/server/Dockerfile
# Secrets (never commit them):      fly secrets set -c apps/server/fly.toml \
#   SUPABASE_URL=https://<project>.supabase.co SUPABASE_SECRET_KEY=<secret key> \
#   ALLOWED_ORIGINS=https://<owner>.github.io
app = "guildhood-game"          # change to a unique name
primary_region = "iad"          # change to the region closest to your players

[env]
  PORT = "2567"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 2567
  force_https = true
  # Live sessions are held in memory: keep exactly one machine running and never auto-stop it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
